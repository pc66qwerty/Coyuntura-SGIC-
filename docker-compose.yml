services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/monitorvial.db
      - JWT_SECRET=${JWT_SECRET:-cambiar_en_produccion_secreto_seguro}
      - STORAGE_PATH=/app/storage
    volumes:
      - backend_data:/app/data
      - backend_storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_storage:
