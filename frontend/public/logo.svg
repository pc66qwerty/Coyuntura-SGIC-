  <rect width="512" height="512" rx="96" fill="#1E3A5F"/>

  <!-- Road / highway lines -->
  <rect x="236" y="80" width="40" height="352" rx="20" fill="#3B82F6" opacity="0.25"/>

  <!-- Map / route path -->
