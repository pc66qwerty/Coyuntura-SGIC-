  <!-- Center dashed lane markers -->
  <rect x="248" y="160" width="16" height="48" rx="8" fill="#fff" opacity="0.6"/>
  <rect x="248" y="232" width="16" height="48" rx="8" fill="#fff" opacity="0.6"/>
  <rect x="248" y="304" width="16" height="48" rx="8" fill="#fff" opacity="0.6"/>

